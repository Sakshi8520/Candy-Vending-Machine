<!DOCTYPE html>
<html>
<body>
	<h1>CORS Test</h1>
	<script>
		fetch("http://127.0.0.1:5000/auth/users/log_in", {
			method: "POST",
			headers: {"Content-Type":"application/json"},
			credentials: "include",
			body: JSON.stringify({

			})

		.catch(error => console.log(error));
			
	</script>
</body>
</html>
